version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    reviewers:
      - jankrajewskiit
    commit-message:
      prefix: chore
    groups:
      eslint:
        patterns:
          - eslint*
      prettier:
        patterns:
          - prettier*
      vite:
        patterns:
          - vite*
      typescript:
        patterns:
          - typescript*
      jankrajewskiit:
        patterns:
          - '@jankrajewskiit/*'
      solid:
        patterns:
          - solid-js*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    reviewers:
      - jankrajewskiit
    commit-message:
      prefix: chore
