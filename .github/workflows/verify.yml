name: verify

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit
        run: npm audit --audit-level=high

      - name: Verify
        run: npm run verify
